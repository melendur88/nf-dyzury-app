name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NF-Dyzury app.py
      - uses: actions/upload-artifact@v4
        with:
          name: NF-Dyzury-windows
          path: dist/NF-Dyzury.exe
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/NF-Dyzury.exe --generate-notes --title $env:GITHUB_REF_NAME
